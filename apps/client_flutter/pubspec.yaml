name: ecoshop_client
description: "EcoShop — gestion scolaire, marketplace et moteur de révision (GSG)."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # État
  flutter_riverpod: ^2.6.1

  # Backend Supabase
  supabase_flutter: ^2.8.0
  # Connexion avec le compte Google du téléphone (REG-16).
  google_sign_in: ^7.2.0

  # Stockage hors-ligne (SQLite/Drift)
  drift: ^2.20.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilitaires
  connectivity_plus: ^6.1.0
  uuid: ^4.4.0
  intl: ^0.19.0
  http: ^1.2.2
  crypto: ^3.0.6
  pdf: ^3.13.0
  printing: ^5.15.0

  # Paiement Orange Money (REG-02) — ouverture de la page de paiement de
  # l'opérateur hors de l'application (navigateur ou appli Orange Money).
  url_launcher: ^6.3.1

  # Scan d'exercice (M16 5/7) — photo capturée puis OCR 100% embarqué : la
  # photo elle-même ne quitte jamais l'appareil, voir la migration
  # `20260906001509`.
  image_picker: ^1.1.2

  # Portail (REG-09) : lecture des cartes d'élève à QR code par la caméra
  # (Android, iOS) ; sur PC, une douchette USB fait office de clavier.
  mobile_scanner: ^7.1.4

  # Notifications push (arrivée au portail, absence, relances, inscriptions)
  # — Firebase Cloud Messaging, téléphones Android et iOS uniquement.
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0

  # Transport scolaire (M18) : position du bus pendant le trajet seulement,
  # téléphone du chauffeur, écran ouvert (jamais en arrière-plan).
  geolocator: ^14.0.2
  google_mlkit_text_recognition: ^0.15.0
  flutter_secure_storage: 11.2.0
  cryptography: 2.9.0
  cryptography_flutter: 2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    # Logo « G » officiel de Google (bouton de connexion), en 1x à 4x.
    - assets/images/google_g.png
