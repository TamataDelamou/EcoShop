name: ecoshop_client
description: "EcoShop — gestion scolaire, marketplace et moteur de révision (GSG)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # État
  flutter_riverpod: ^2.6.1

  # Backend Supabase
  supabase_flutter: ^2.8.0

  # Stockage hors-ligne (SQLite/Drift)
  drift: ^2.20.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilitaires
  connectivity_plus: ^6.1.0
  uuid: ^4.4.0
  intl: ^0.19.0
  http: ^1.2.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
