<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil direction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17603C}a:hover{color:#0F4429}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:14px 6px 12px;background:#FFFFFF;border:1px solid #E3E7E2;border-radius:18px;font:inherit;color:#1C2321;cursor:pointer;min-height:96px}
.tile .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.tile .lb{font-size:13px;font-weight:600;line-height:1.2;text-align:center}
.badge{position:absolute;top:8px;right:10px;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#B9480F;color:#FFFFFF;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.iconbtn{position:relative;width:44px;height:44px;border-radius:22px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1C2321}
.todo{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#FFFFFF;border:none;border-radius:14px;font:inherit;color:#1C2321;text-align:left;cursor:pointer;width:100%}
.sec{margin:0 4px 12px;font-size:14px;font-weight:700;color:#4A5551;text-transform:uppercase;letter-spacing:0.6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
</style>
</helmet>
<div style="width: 390px; height: 2030px; box-sizing: border-box; background: #F5F7F4; font-family: 'Figtree', system-ui, sans-serif; color: #1C2321; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 4px 20px">
<span style="font-size: 20px; font-weight: 800; color: #17603C; letter-spacing: -0.3px">EcoShop</span>
<div style="display: flex; align-items: center; gap: 2px">
<button class="iconbtn" aria-label="Notifications, 8 nouvelles">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
<span class="badge" style="top: 4px; right: 2px">8</span>
</button>
<button class="iconbtn" aria-label="Apparence : automatique">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
</button>
<button class="iconbtn" aria-label="Mon profil">
<span style="width: 34px; height: 34px; border-radius: 17px; background: #1E4FA8; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">FC</span>
</button>
</div>
</div>

<div style="padding: 14px 20px 6px">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1">Fodé Camara</h1>
<div style="display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap">
<span style="padding: 5px 12px; border-radius: 999px; background: #DCE7FB; color: #173A80; font-size: 13px; font-weight: 700">Direction</span>
<span style="padding: 5px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E7E2; color: #3B4541; font-size: 13px; font-weight: 600">École Bambino Emmaüs</span>
</div>
</div>

<div style="padding: 16px 16px 0">
<label for="recherche" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Que voulez-vous faire ?</label>
<div style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; background: #FFFFFF; border: 1px solid #D5DBD4; border-radius: 25px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6662" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="recherche" type="search" placeholder="Que voulez-vous faire ? (reçu, salle…)" style="flex: 1; border: none; outline: none; font: inherit; font-size: 15px; color: #1C2321; background: transparent">
</div>
</div>

<div style="margin: 18px 16px 0; padding: 14px; border-radius: 18px; background: #E9F3EC; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 4px 2px; font-size: 14px; font-weight: 700; color: #0F4429; text-transform: uppercase; letter-spacing: 0.6px">À faire</h2>
<button class="todo"><span style="width: 10px; height: 10px; border-radius: 5px; background: #B9480F; flex: none"></span><span style="flex: 1; font-size: 15px; font-weight: 600">3 demandes de liaison à valider</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7672" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<button class="todo"><span style="width: 10px; height: 10px; border-radius: 5px; background: #B9480F; flex: none"></span><span style="flex: 1; font-size: 15px; font-weight: 600">5 numéros à confirmer</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7672" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<button class="todo"><span style="width: 10px; height: 10px; border-radius: 5px; background: #B9480F; flex: none"></span><span style="flex: 1; font-size: 15px; font-weight: 600">12 familles en retard de paiement</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7672" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>

<div style="padding: 22px 16px 0">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px">
<h2 class="sec" style="margin: 0 4px">Mes raccourcis</h2>
<button style="border: none; background: transparent; font: inherit; font-size: 14px; font-weight: 700; color: #17603C; cursor: pointer; padding: 10px 6px">Modifier</button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button class="tile" style="min-height: 88px; padding: 12px 4px 10px"><span class="ic" style="background: #FFF1D6; color: #855004"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"></path><path d="M8 9h8M8 13h8M8 17h5"></path></svg></span><span class="lb" style="font-size: 12px">Encaisse-<br>ments</span></button>
<button class="tile" style="min-height: 88px; padding: 12px 4px 10px"><span class="ic" style="background: #E6F0FB; color: #1E4FA8"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg></span><span class="lb" style="font-size: 12px">Annonces</span></button>
<button class="tile" style="min-height: 88px; padding: 12px 4px 10px"><span class="badge" style="top: 6px; right: 6px">12</span><span class="ic" style="background: #FBE4E8; color: #A3233B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></span><span class="lb" style="font-size: 12px">Relances</span></button>
<button class="tile" style="min-height: 88px; padding: 12px 4px 10px"><span class="ic" style="background: #E3F2EA; color: #17603C"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span><span class="lb" style="font-size: 12px">Rapports</span></button>
</div>
</div>

<div style="padding: 26px 16px 0">
<h2 class="sec">Vie de l'école</h2>
<div class="grid3">
<button class="tile"><span class="ic" style="background: #E6F0FB; color: #1E4FA8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1z"></path><path d="M16 9a4 4 0 0 1 0 6"></path><path d="M19 6a8 8 0 0 1 0 12"></path></svg></span><span class="lb">Annonces</span></button>
<button class="tile"><span class="badge">4</span><span class="ic" style="background: #FCEBDD; color: #A2460D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"></path><path d="M4 17a3 3 0 0 1 3-3h11"></path></svg></span><span class="lb">Cahier de liaison</span></button>
<button class="tile"><span class="ic" style="background: #E1F3F4; color: #136B72"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"></path></svg></span><span class="lb">Présence au portail</span></button>
<button class="tile"><span class="badge">2</span><span class="ic" style="background: #FBE4E8; color: #A3233B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg></span><span class="lb">Alertes décrochage</span></button>
</div>
</div>

<div style="padding: 26px 16px 0">
<h2 class="sec">Élèves</h2>
<div class="grid3">
<button class="tile"><span class="badge">6</span><span class="ic" style="background: #EDEFEC; color: #3B4541"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg></span><span class="lb">Inscriptions en ligne</span></button>
<button class="tile"><span class="ic" style="background: #E3F2EA; color: #17603C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"></path></svg></span><span class="lb">Nouvelle inscription</span></button>
<button class="tile"><span class="ic" style="background: #EEE9FB; color: #5233A8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"></path></svg></span><span class="lb">Réinscription</span></button>
<button class="tile"><span class="badge">3</span><span class="ic" style="background: #E6F0FB; color: #1E4FA8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"></path><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"></path></svg></span><span class="lb">Comptes liés</span></button>
</div>
</div>

<div style="padding: 26px 16px 0">
<h2 class="sec">Finances</h2>
<div class="grid3">
<button class="tile"><span class="ic" style="background: #FFF1D6; color: #855004"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"></path><path d="M8 9h8M8 13h8M8 17h5"></path></svg></span><span class="lb">Encaissements</span></button>
<button class="tile"><span class="badge">12</span><span class="ic" style="background: #FBE4E8; color: #A3233B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></span><span class="lb">Relances</span></button>
<button class="tile"><span class="ic" style="background: #E3F2EA; color: #17603C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"></path></svg></span><span class="lb">Comptabilité</span></button>
<button class="tile"><span class="ic" style="background: #FCEBDD; color: #A2460D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></span><span class="lb">Orange Money</span></button>
<button class="tile"><span class="ic" style="background: #EDEFEC; color: #3B4541"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></span><span class="lb">Paramètres</span></button>
<button class="tile"><span class="ic" style="background: #E1F3F4; color: #136B72"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></span><span class="lb">Crédits SMS</span></button>
</div>
</div>

<div style="padding: 26px 16px 0">
<h2 class="sec">Personnel</h2>
<div class="grid3">
<button class="tile"><span class="ic" style="background: #E6F0FB; color: #1E4FA8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></span><span class="lb">Invitations</span></button>
<button class="tile"><span class="ic" style="background: #EEE9FB; color: #5233A8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"></path></svg></span><span class="lb">Personnel et RH</span></button>
<button class="tile"><span class="badge">5</span><span class="ic" style="background: #E3F2EA; color: #17603C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg></span><span class="lb">Numéros à confirmer</span></button>
</div>
</div>

<div style="padding: 26px 16px 0">
<h2 class="sec">Organisation</h2>
<div class="grid3">
<button class="tile"><span class="ic" style="background: #EEE9FB; color: #5233A8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 10h18M8 2v4M16 2v4"></path></svg></span><span class="lb">Classes et emploi du temps</span></button>
<button class="tile"><span class="ic" style="background: #EDEFEC; color: #3B4541"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M14 12h.01"></path></svg></span><span class="lb">Salles</span></button>
<button class="tile"><span class="ic" style="background: #FCEBDD; color: #A2460D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg></span><span class="lb">Bibliothèque</span></button>
<button class="tile"><span class="ic" style="background: #FBE4E8; color: #A3233B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="14" rx="2"></rect><path d="M4 11h16M8 21v-4M16 21v-4"></path></svg></span><span class="lb">Transport</span></button>
<button class="tile"><span class="ic" style="background: #E1F3F4; color: #136B72"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="5" rx="1"></rect><rect x="2" y="17" width="6" height="5" rx="1"></rect><rect x="16" y="17" width="6" height="5" rx="1"></rect><path d="M12 7v5M5 17v-5h14v5"></path></svg></span><span class="lb">Structures</span></button>
</div>
</div>

<div style="padding: 26px 16px 28px">
<h2 class="sec">Établissement</h2>
<div class="grid3">
<button class="tile"><span class="ic" style="background: #E3F2EA; color: #17603C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1.5"></circle><circle cx="17.5" cy="10.5" r="1.5"></circle><circle cx="8.5" cy="7.5" r="1.5"></circle><path d="M12 2a10 10 0 0 0 0 20c1 0 1.6-.8 1.6-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.7 1.7-1.7h2a5.5 5.5 0 0 0 5.5-5.5C22 6 17.5 2 12 2z"></path></svg></span><span class="lb">Identité visuelle</span></button>
<button class="tile"><span class="ic" style="background: #E6F0FB; color: #1E4FA8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span><span class="lb">Rapports</span></button>
<button class="tile"><span class="ic" style="background: #EDEFEC; color: #3B4541"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V9l7-5 7 5v12M10 21v-6h4v6"></path></svg></span><span class="lb">Ouvrir un établissement</span></button>
</div>
</div>
