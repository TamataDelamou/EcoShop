<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F5F7F4; font-family: 'Figtree', system-ui, sans-serif; color: #1C2321; display: flex; flex-direction: column">

<span style="width: 76px; height: 76px; border-radius: 38px; background: #17603C; color: #FFFFFF; font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center">MS</span>

<button class="row"><span class="t">Langue et affichage<span class="s">Langue, taille du texte, accessibilité</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7672" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
