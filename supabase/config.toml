project_id = "ecoshop-gsg"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# ---------------------------------------------------------------------------
# Authentification (cahier v4.1, ch. 5 ; REG-16)
# Connexion par e-mail (code à 6 chiffres) ou par le compte Google du
# téléphone. Les codes par SMS sont suspendus (coût d'un SMS par
# connexion) ; le numéro est demandé après la connexion. Les fournisseurs
# sont configurés par secrets, jamais en clair dans ce fichier.
# ---------------------------------------------------------------------------
[auth]
enabled = true
site_url = "env(SUPABASE_SITE_URL)"
additional_redirect_urls = ["io.gsg.ecoshop://login-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Élève et Parent s'auto-inscrivent ; les rôles à privilège passent par
# invitation. L'inscription reste donc ouverte, le rôle est ce qui est bridé.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.sms]
# Suspendu (REG-16) : remettre à true, avec le crochet ci-dessous, pour
# rouvrir la connexion par code SMS.
enable_signup = false
enable_confirmations = true
otp_length = 6
otp_expiry = 600
# Codes de connexion par SMS : envoyés par Orange SMS Guinée via le crochet
# « Send SMS » (Edge Function envoyer_sms_auth), plus par Twilio (environ
# 0,25 USD par code vers la Guinée, compte à part). Twilio reste décrit
# ci-dessous, désactivé, pour un éventuel pays non couvert par Orange.
[auth.hook.send_sms]
enabled = false
uri = "env(SEND_SMS_HOOK_URI)"
secrets = "env(SEND_SMS_HOOK_SECRETS)"

[auth.sms.twilio]
enabled = false
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

# Connexion avec le compte Google du téléphone (REG-16). L'application
# obtient un jeton d'identité Google et le remet à Supabase
# (signInWithIdToken) : client_id = identifiant client « Application Web »
# du projet Google (celui du projet Firebase EcoShop).
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_WEB_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

# Custom Access Token Hook — recopie role_racine / statut_compte dans
# le jeton (cache de confort ; la source de vérité reste public.profiles).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

# KER-MUT (docs/REGISTRE.md REG-01) — le Kernel GSG devient un Control Plane.
# La fédération GSG ID (gsg-id-federate) est retirée. Les deux fonctions
# ci-dessous vérifient elles-mêmes leur jeton (inter-services ou secret de
# déclenchement) : la vérification JWT Supabase de la plateforme est désactivée.
# REG-02 Orange Money Guinée : l'initiation est appelée par le client
# (JWT vérifié par la plateforme) ; la notification est appelée par Orange
# (pas de JWT Supabase), authentifiée par empreinte du notif_token puis
# reconfirmée auprès d'Orange.
[functions.initier_paiement_orange_money]
enabled = true
verify_jwt = true

[functions.recevoir_notification_orange_money]
enabled = true
verify_jwt = false

# Relance planifiée (L7) : protégée par l'en-tête x-declencheur-secret.
[functions.relancer_paiements_orange_money]
enabled = true
verify_jwt = false

# Envoi des courriels (REG-04) : appelée par pg_cron, en-tête x-declencheur-secret.
[functions.envoyer_notifications]
enabled = true
verify_jwt = false

# Lien « Ce n'est pas moi » des courriels (REG-22 A) : publique, le jeton à
# usage unique fait foi ; GET = confirmation, POST = action.
[functions.pas_moi]
enabled = true
verify_jwt = false

# Notifications push (REG-09) : appelée par pg_cron, en-tête x-declencheur-secret.
# Kit de mise en service : codes de connexion par SMS Orange, appelée par
# Supabase Auth (crochet « Send SMS », signature Standard Webhooks).
[functions.envoyer_sms_auth]
verify_jwt = false

[functions.envoyer_push]
enabled = true
verify_jwt = false

[functions.kernel-export]
enabled = true
verify_jwt = false

[functions.kernel-control-plane]
enabled = true
verify_jwt = false

# M16 — Edge Functions IA (sous-livrable 3/7) : verify_jwt = true (défaut),
# la plateforme vérifie la signature avant même d'invoquer la fonction —
# le rôle réel est ensuite revérifié côté SQL (`determiner_role_ia`),
# jamais celui envoyé par le client.
[functions.envoyer_message_ia]
enabled = true
verify_jwt = true

[functions.demarrer_analyse_risque_echec]
enabled = true
verify_jwt = true

[functions.analyser_usage_parent_ia]
enabled = true
verify_jwt = true

# M16 — Scan et résolution d'exercice (sous-livrable 5/7).
[functions.demarrer_scan_exercice]
enabled = true
verify_jwt = true

# Facturation/Quota IA, étape (b) — brique CinetPay générique. initiation
# authentifiée normalement ; le webhook est appelé DIRECTEMENT par les
# serveurs CinetPay (jamais un JWT Supabase) -- verify_jwt = false, la
# signature CinetPay est la SEULE barrière, vérifiée côté SQL
# (traiter_webhook_cinetpay, voir migration 20260906001515).
[functions.initier_paiement_cinetpay]
enabled = true
verify_jwt = true

[functions.recevoir_webhook_cinetpay]
enabled = true
verify_jwt = false

# Connexion avec l'identifiant EcoShop (REG-18) : appelée avant toute
# connexion, avec la seule clé publique — essais limités dans la fonction.
[functions.connexion_identifiant]
enabled = true
verify_jwt = false

[edge_runtime]
policy = "oneshot"
