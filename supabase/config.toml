project_id = "ecoshop-gsg"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# ---------------------------------------------------------------------------
# Authentification (cahier v4.1, ch. 5)
# Deux entrées — téléphone et e-mail — et quatre canaux de délivrance.
# Les fournisseurs (Twilio SMS/WhatsApp, Resend) sont configurés par secrets,
# jamais en clair dans ce fichier.
# ---------------------------------------------------------------------------
[auth]
enabled = true
site_url = "env(SUPABASE_SITE_URL)"
additional_redirect_urls = ["io.gsg.ecoshop://login-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Élève et Parent s'auto-inscrivent ; les rôles à privilège passent par
# invitation. L'inscription reste donc ouverte, le rôle est ce qui est bridé.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.sms]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
# Twilio est renseigné par variables d'environnement (coffre-fort).
[auth.sms.twilio]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

# Custom Access Token Hook — recopie role_racine / gsg_id / statut_compte dans
# le jeton (cache de confort ; la source de vérité reste public.profiles).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[functions.gsg-id-federate]
enabled = true
verify_jwt = false   # la fonction vérifie elle-même la signature via JWKS (ch. 5.5)

# M16 — Edge Functions IA (sous-livrable 3/7) : verify_jwt = true (défaut),
# la plateforme vérifie la signature avant même d'invoquer la fonction —
# le rôle réel est ensuite revérifié côté SQL (`determiner_role_ia`),
# jamais celui envoyé par le client.
[functions.envoyer_message_ia]
enabled = true
verify_jwt = true

[functions.demarrer_analyse_risque_echec]
enabled = true
verify_jwt = true

[edge_runtime]
policy = "oneshot"
