name: CI — EcoShop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Base (migrations, seeds, pgTAP, audit)
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer la CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Installer psql (client PostgreSQL)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Démarrer la stack locale
        run: supabase start

      - name: Réinitialiser la base (toutes les migrations + seed M0)
        run: supabase db reset

      - name: Tests pgTAP (tous les scripts de tests/rls)
        # Les échecs remontent aussi en annotations (lisibles sans le journal).
        run: |
          set +e
          supabase test db --local tests/rls 2>&1 | tee pgtap.txt
          statut=${PIPESTATUS[0]}
          # GitHub garde 10 annotations par étape : d'abord les erreurs SQL et
          # les scripts en échec, puis le détail des tests.
          { grep -E "ERROR:|Bad plan" pgtap.txt; grep -E "# +(Failed test|got|expected|caught|wanted|have|want)" pgtap.txt; grep -E "Wstat" pgtap.txt; } | grep -vE "NOTICE:|WARNING:" | head -10 | sed 's/^/::error title=pgTAP::/'
          exit $statut

      - name: Appliquer les seeds complémentaires (M4→M14)
        run: |
          FAILED=0
          for f in supabase/seed_referentiel_pedagogique.sql \
                   supabase/seed_administration_scolarite.sql \
                   supabase/seed_notes_evaluations.sql \
                   supabase/seed_vie_scolaire.sql \
                   supabase/seed_rh_personnel.sql \
                   supabase/seed_communication_notifications.sql \
                   supabase/seed_rapports_statistiques.sql \
                   supabase/seed_planification_agenda.sql \
                   supabase/seed_marketplace_assoshop.sql \
                   supabase/seed_comptabilite.sql; do
            if ! psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"; then
              echo "SEED_ECHEC: $f"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then exit 1; fi

      - name: Audit de cohérence inter-modules
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f tests/integration/audit_coherence.sql

  flutter:
    name: Client Flutter (analyse + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client_flutter
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Résoudre les dépendances
        run: flutter pub get

      - name: Analyse statique
        # Chaque remarque devient une annotation sur le fichier concerné.
        run: |
          set +e
          flutter analyze 2>&1 | tee analyse.txt
          statut=${PIPESTATUS[0]}
          sed -nE 's/^ *(info|warning|error) • (.*) • ([^:]+):([0-9]+):([0-9]+) • (.*)$/::error file=apps\/client_flutter\/\3,line=\4,col=\5,title=\6::\2/p' analyse.txt
          exit $statut

      - name: Tests unitaires
        # Lancés même si l'analyse a des remarques : un échec n'en cache pas un autre.
        if: success() || failure()
        run: flutter test --reporter github

  edge_functions:
    name: Edge Functions (vérification de types + tests Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tests du module inter-services (KER-MUT K3)
        run: deno test --allow-env supabase/functions/_shared/interservices_test.ts

      - name: Tests du client Orange Money (REG-02)
        run: deno test --allow-env supabase/functions/_shared/orange_money_client_test.ts

      - name: Tests des courriels transactionnels (REG-04)
        run: deno test --allow-env supabase/functions/_shared/courriel_test.ts

      - name: Tests du client de notifications push (REG-11)
        run: deno test --allow-env supabase/functions/_shared/fcm_client_test.ts

      - name: Tests des codes de connexion par SMS Orange (mise en service)
        run: deno test --allow-env supabase/functions/_shared/sms_auth_test.ts

      - name: Vérification de types — Control Plane Kernel, Orange Money, courriels
        run: deno check supabase/functions/kernel-export/index.ts supabase/functions/kernel-control-plane/index.ts supabase/functions/initier_paiement_orange_money/index.ts supabase/functions/recevoir_notification_orange_money/index.ts supabase/functions/relancer_paiements_orange_money/index.ts supabase/functions/envoyer_notifications/index.ts supabase/functions/envoyer_push/index.ts supabase/functions/envoyer_sms_auth/index.ts supabase/functions/initier_paiement_cinetpay/index.ts
