name: CI — Socle EcoShop (M0→M15)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Base (migrations, seeds, pgTAP, audit)
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer la CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Installer psql (client PostgreSQL)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Démarrer la stack locale
        run: supabase start

      - name: Réinitialiser la base (migrations M0→M15 + seed M0)
        run: supabase db reset

      - name: Tests pgTAP (RLS 01→36)
        run: supabase test db --local tests/rls

      - name: Appliquer les seeds complémentaires (M4→M14)
        run: |
          FAILED=0
          for f in supabase/seed_referentiel_pedagogique.sql \
                   supabase/seed_administration_scolarite.sql \
                   supabase/seed_notes_evaluations.sql \
                   supabase/seed_vie_scolaire.sql \
                   supabase/seed_rh_personnel.sql \
                   supabase/seed_communication_notifications.sql \
                   supabase/seed_rapports_statistiques.sql \
                   supabase/seed_planification_agenda.sql \
                   supabase/seed_marketplace_assoshop.sql \
                   supabase/seed_comptabilite.sql; do
            if ! psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"; then
              echo "SEED_ECHEC: $f"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then exit 1; fi

      - name: Audit de cohérence inter-modules
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f tests/integration/audit_coherence.sql

  flutter:
    name: Client Flutter (analyse + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client_flutter
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Résoudre les dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests unitaires
        run: flutter test
